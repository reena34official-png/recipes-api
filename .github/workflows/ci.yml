name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run:
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name : Run migrations
        run: |
          poetry run python manage.py migrate --noinput

      - name: Run pytest with coverage
        continue-on-error: true
        run: |
          poetry run coverage run -m pytest --junit-xml=pytest.xml
          poetry run coverage xml -o coverage.xml

      - name: Publish coverage results
        if: always()
        uses: aGallea/tests-coverage-report@v1
        with:
          cobertura-path:
            coverage.xml
          junit-path:
            pytest.xml
          show-diffcover: 'true'

      - name: Review agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: gpt-4o-mini
        run: poetry run python agent.py $GITHUB_TOKEN $REPOSITORY $PR_NUMBER $OPENAI_API_KEY $OPENAI_BASE_URL

      - name: Post PR review as Actions bot
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number }
            );
            for (const review of reviews) {
              if (review.user?.login === 'github-actions[bot]' && review.state === 'PENDING') {
                await github.rest.pulls.deletePendingReview({
                  owner,
                  repo,
                  pull_number,
                  review_id: review.id,
                });
              }
            }
            const hasBotReview = reviews.some(
              (r) => r.user?.login === 'github-actions[bot]' && r.state !== 'PENDING'
            );
            if (hasBotReview) {
              core.info('github-actions[bot] review already present.');
              return;
            }
            if (!fs.existsSync('review_body.txt')) {
              core.setFailed('review_body.txt was not created by the agent.');
              return;
            }
            const body = fs.readFileSync('review_body.txt', 'utf8').trim();
            if (!body) {
              core.setFailed('Review body is empty.');
              return;
            }
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              body,
              event: 'COMMENT',
              commit_id: context.payload.pull_request.head.sha,
            });
